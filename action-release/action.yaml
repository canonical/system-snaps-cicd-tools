name: 'ReleaseSystemSnap'
description: 'Release a system snap to the beta channel'
author: 'Alfonso Sanchez-Beato'

inputs:
  architectures:
    description: Comma separated list of architectures to override the default
    required: false
    type: string
    default: ""
  snapcraft_channel:
    description: Snapcraft snap installation channel
    required: false
    type: string
    default: ""
  publish:
    description: Publish the snaps to the beta channel
    required: false
    type: boolean
    # Even though publishing directly from this action does not work, leave
    # this on by default so that other consumers are actually notified that the
    # publishing did not succeed.
    default: true

outputs:
  snap_name:
    description: Name of the released snap
    value: ${{ steps.release.outputs.snap_name }}
  channel:
    description: Store channel the snap is published to
    value: ${{ steps.release.outputs.channel }}
  artifact:
    description: Name of the uploaded artifact containing the snaps
    value: ${{ steps.release.outputs.artifact }}

runs:
  using: "composite"
  steps:
    - name: Cleanup job workspace
      shell: bash
      run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
    - name: Checking out
      uses: actions/checkout@v3
      with:
        ref: ${{ github.ref_name }}
        # We need the full history to create the changelog
        fetch-depth: 0
    - name: Checking out CICD scripts
      uses: actions/checkout@v3
      with:
        repository: snapcore/system-snaps-cicd-tools
        ref: main
        path: cicd
    - name: Release
      id: release
      shell: bash
      env:
        BUILD_ARCHITECTURES: ${{ inputs.architectures }}
        SNAPCRAFT_CHANNEL: ${{ inputs.snapcraft_channel }}
        REF: ${{ github.ref_name }}
      run: |
        printf "Releasing from %s\n" "$REF"
        # Compute channel before snap-release.sh pushes tags/commits
        track=${REF##*-}
        if [ -z "$track" ]; then
            printf "ERROR: no track has been specified\n"
            exit 1
        fi
        if [ "$track" = main ] || [ "$track" = master ]; then
            track=latest
        fi

        # TODO better probably to have a local install
        mkdir -p ~/bin
        wget -q https://github.com/mikefarah/yq/releases/download/v4.30.8/yq_linux_amd64.tar.gz \
            -O - | tar xz
        mv yq_linux_amd64 ~/bin/yq
        wget -q https://storage.googleapis.com/snapd-spread-tests/spread/spread-plus-amd64.tar.gz \
            -O - | tar xz
        mv spread ~/bin/spread
        export PATH=$PATH:~/bin/
        ./cicd/workflows/snap-release.sh "$REF" "$RUNNER_TEMP"
        for s in "${{ runner.temp }}"/*_*.snap; do
            s=${s##*/}
            SNAP_NAME=${s%%_*}
            break
        done
        echo "SNAP_NAME=$SNAP_NAME" >> $GITHUB_ENV
        echo "snap_name=$SNAP_NAME" >> "$GITHUB_OUTPUT"
        echo "channel=$track/beta" >> "$GITHUB_OUTPUT"
        echo "artifact=$SNAP_NAME-snaps" >> "$GITHUB_OUTPUT"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.release.outputs.artifact }}
        path: ${{ runner.temp }}/${{ env.SNAP_NAME }}_*.snap
    - name: Publish the snaps to beta channel
      if: ${{ inputs.publish == true || inputs.publish == 'true' }}
      shell: bash
      run: |
        echo "Publishing needs extra work: please see https://github.com/canonical/system-snaps-cicd-tools/issues/49"
        exit 1
